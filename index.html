<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Autos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🚗 Galería de Autos</h1>
        <p>Conoce nuestros vehículos destacados</p>
    </header>

    <main class="contenedor">

        <!-- AUTO 1 -->
        <div class="tarjeta">
            <img src="imagenes/auto1.jpg" alt="Auto deportivo">
            
            <div class="contenido">
                <h2>Auto Deportivo</h2>
                <p>
                    Vehículo moderno, elegante y deportivo,
                    diseñado para ofrecer una excelente experiencia de conducción.
                </p>
                <button>Ver detalles</button>
            </div>
        </div>

        <!-- AUTO 2 -->
        <div class="tarjeta">
            <img src="imagenes/auto2.jpg" alt="Auto moderno">
            
            <div class="contenido">
                <h2>Auto Moderno</h2>
                <p>
                    Diseño moderno, tecnología avanzada y gran comodidad
                    para disfrutar de cada viaje.
                </p>
                <button>Ver detalles</button>
            </div>
        </div>

    </main>

    <footer>
        <p>© 2026 Galería de Autos</p>
    </footer>

</body>
</html>
